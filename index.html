<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🍎 사과게임</title>
<style>
  :root {
    --cell-size: min(3.6vw, 46px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    overflow: hidden;
    user-select: none;
    background: linear-gradient(135deg, #fff6e5 0%, #ffe3d0 40%, #ffd7e8 70%, #e0f3ff 100%);
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
  }

  /* decorative floating blobs */
  .bg-decor {
    position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0;
  }
  .bg-decor span {
    position: absolute; font-size: 40px; opacity: 0.18;
    animation: float 14s ease-in-out infinite;
  }
  .bg-decor span:nth-child(1){ top:8%; left:6%; animation-delay:0s;}
  .bg-decor span:nth-child(2){ top:70%; left:4%; animation-delay:2s; font-size:56px;}
  .bg-decor span:nth-child(3){ top:15%; left:90%; animation-delay:4s; font-size:50px;}
  .bg-decor span:nth-child(4){ top:80%; left:88%; animation-delay:1s;}
  .bg-decor span:nth-child(5){ top:45%; left:2%; animation-delay:3s; font-size:34px;}
  .bg-decor span:nth-child(6){ top:50%; left:95%; animation-delay:5s; font-size:34px;}
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-24px) rotate(12deg); }
  }

  .game-wrap {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    gap: 10px;
    padding: 12px;
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%;
    gap: 18px;
    padding: 10px 22px;
    background: rgba(255,255,255,0.75);
    border-radius: 20px;
    box-shadow: 0 6px 20px rgba(200, 90, 90, 0.15);
    backdrop-filter: blur(6px);
  }

  .title {
    font-size: 22px; font-weight: 800; color: #d9375a;
    display: flex; align-items: center; gap: 6px;
    letter-spacing: -0.5px;
  }

  .stat {
    display: flex; flex-direction: column; align-items: center;
    min-width: 90px;
  }
  .stat .label { font-size: 11px; color: #a97a7a; font-weight: 600; letter-spacing: 1px;}
  .stat .value {
    font-size: 26px; font-weight: 800; color: #4a3b3b;
    font-variant-numeric: tabular-nums;
    transition: color .2s;
  }
  .stat.time.low .value { color: #e5304a; animation: pulse 0.6s infinite; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  .stat.best .value { color: #d98a00; }
  .stat.best.flash .value { animation: bestFlash .5s ease; }
  @keyframes bestFlash {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); color: #ff8a00; }
  }

  .score-pop-host { position: relative; }
  .score-pop {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    color: #21a35a; font-weight: 800; font-size: 16px;
    animation: popUp .8s ease-out forwards;
    pointer-events: none;
  }
  @keyframes popUp {
    0% { opacity: 0; transform: translate(-50%, 4px) scale(0.8); }
    30% { opacity: 1; transform: translate(-50%, -14px) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -34px) scale(1); }
  }

  .board-frame {
    position: relative;
    background: rgba(255,255,255,0.55);
    border-radius: 22px;
    padding: 12px;
    box-shadow: 0 10px 30px rgba(180, 90, 90, 0.18), inset 0 0 0 2px rgba(255,255,255,0.6);
  }

  #board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(17, var(--cell-size));
    grid-template-rows: repeat(10, var(--cell-size));
    gap: 2px;
    touch-action: none;
  }

  .cell {
    position: relative;
    width: var(--cell-size); height: var(--cell-size);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  .apple {
    position: relative;
    width: 86%; height: 86%;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #ff9a8f 0%, #ef4a4a 42%, #d81f37 78%, #b71330 100%);
    box-shadow: 0 3px 6px rgba(150, 20, 30, 0.35), inset -3px -4px 6px rgba(0,0,0,0.15), inset 3px 4px 6px rgba(255,255,255,0.35);
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  .apple::before { /* highlight shine */
    content: "";
    position: absolute; top: 14%; left: 22%;
    width: 30%; height: 22%;
    background: rgba(255,255,255,0.55);
    border-radius: 50%;
    filter: blur(1px);
  }
  .apple::after { /* leaf */
    content: "";
    position: absolute; top: -22%; left: 54%;
    width: 46%; height: 30%;
    background: linear-gradient(120deg, #8fd45c, #4fae2f);
    border-radius: 0% 100% 0% 100%;
    transform: rotate(-18deg);
    box-shadow: inset 0 0 2px rgba(0,0,0,0.2);
  }
  .stem {
    position: absolute; top: -16%; left: 47%;
    width: 10%; height: 26%;
    background: linear-gradient(#8a5a2b, #6b4420);
    border-radius: 2px;
    transform: rotate(6deg);
  }

  .num {
    position: relative; z-index: 2;
    color: #fff;
    font-weight: 800;
    font-size: calc(var(--cell-size) * 0.42);
    text-shadow: 0 1px 2px rgba(0,0,0,0.35);
  }

  .cell.removed .apple, .cell.removed .stem { visibility: hidden; }
  .cell.removed { cursor: default; }

  .cell.selected .apple {
    transform: scale(1.12);
    filter: brightness(1.08);
    box-shadow: 0 0 0 3px #ffd23f, 0 4px 10px rgba(150,20,30,0.4);
  }
  .cell.selected.hit .apple {
    box-shadow: 0 0 0 3px #38e07a, 0 0 14px 4px rgba(56,224,122,0.7);
    filter: brightness(1.15);
  }

  .cell.popping .apple {
    animation: pop .35s ease forwards;
  }
  .cell.popping .stem { animation: pop .35s ease forwards; }
  @keyframes pop {
    0% { transform: scale(1.15); opacity: 1; }
    60% { transform: scale(1.35); opacity: 0.7; }
    100% { transform: scale(0); opacity: 0; }
  }

  .cell.shake .apple {
    animation: shake .3s ease;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .selection-box {
    position: absolute;
    border: 2px solid #ffb347;
    background: rgba(255, 190, 90, 0.18);
    border-radius: 8px;
    pointer-events: none;
    display: none;
    z-index: 5;
  }
  .selection-box.hit {
    border-color: #38e07a;
    background: rgba(56, 224, 122, 0.18);
  }

  .sum-badge {
    position: absolute;
    transform: translate(-50%, -130%);
    background: #4a3b3b;
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    padding: 3px 10px;
    border-radius: 12px;
    pointer-events: none;
    display: none;
    z-index: 6;
    white-space: nowrap;
  }
  .sum-badge.hit { background: #21a35a; }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(60, 20, 30, 0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 50;
    backdrop-filter: blur(3px);
  }
  .overlay.hidden { display: none; }

  .panel {
    background: #fffaf3;
    border-radius: 24px;
    padding: 36px 44px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    max-width: 90vw;
    animation: panelIn .25s ease;
  }
  @keyframes panelIn {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }

  .panel h1 {
    font-size: 34px; margin: 0 0 6px; color: #d9375a;
  }
  .panel p { color: #6b5555; font-size: 15px; line-height: 1.6; margin: 6px 0 20px; }
  .panel .final-score {
    font-size: 54px; font-weight: 800; color: #21a35a; margin: 6px 0 22px;
  }

  .btn {
    background: linear-gradient(135deg, #ff7a7a, #e5304a);
    color: #fff; border: none;
    font-size: 18px; font-weight: 700;
    padding: 12px 36px;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(229, 48, 74, 0.4);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(229, 48, 74, 0.5); }
  .btn:active { transform: translateY(0); }

  footer.hint {
    font-size: 13px; color: #9a7d7d;
    margin-top: 2px;
  }

  .firework-particle {
    position: fixed;
    width: 8px; height: 8px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 200;
    animation: fw-fly .9s ease-out forwards;
    box-shadow: 0 0 6px currentColor;
  }
  @keyframes fw-fly {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.3); opacity: 0; }
  }

  .record-banner {
    position: fixed;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, #ffd23f, #ff8a3f);
    color: #5a3200;
    font-size: 28px;
    font-weight: 900;
    padding: 14px 34px;
    border-radius: 40px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.3);
    z-index: 201;
    pointer-events: none;
    white-space: nowrap;
    animation: bannerPop 2.2s ease forwards;
  }
  @keyframes bannerPop {
    0% { opacity: 0; transform: translate(-50%, 20px) scale(0.7); }
    15% { opacity: 1; transform: translate(-50%, 0) scale(1.1); }
    25% { transform: translate(-50%, 0) scale(1); }
    85% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -14px) scale(1); }
  }

  .record-badge {
    display: inline-block;
    background: linear-gradient(135deg, #ffd23f, #ff8a3f);
    color: #5a3200;
    font-weight: 800;
    font-size: 14px;
    padding: 4px 14px;
    border-radius: 14px;
    margin-bottom: 8px;
    animation: bestFlash 1s ease infinite;
  }
</style>
</head>
<body>

<div class="bg-decor">
  <span>🍎</span><span>🍏</span><span>🍎</span><span>🍏</span><span>🍎</span><span>🍏</span>
</div>

<div class="game-wrap">
  <header>
    <div class="title">🍎 사과게임</div>
    <div class="stat time" id="timeStat">
      <div class="label">TIME</div>
      <div class="value" id="timeValue">100</div>
    </div>
    <div class="stat score-pop-host" id="scoreHost">
      <div class="label">SCORE</div>
      <div class="value" id="scoreValue">0</div>
    </div>
    <div class="stat best">
      <div class="label">BEST 🏆</div>
      <div class="value" id="bestValue">0</div>
    </div>
  </header>

  <div class="board-frame">
    <div id="board"></div>
    <div class="selection-box" id="selectionBox"></div>
    <div class="sum-badge" id="sumBadge"></div>
  </div>

  <footer class="hint">드래그해서 사각형 안 사과 숫자의 합이 10이 되게 만들어보세요!</footer>
</div>

<div class="overlay" id="startOverlay">
  <div class="panel">
    <h1>🍎 사과게임 🍎</h1>
    <p>
      드래그로 사각형을 그려서<br>
      그 안에 있는 사과 숫자의 합이 <b>10</b>이 되면 사과가 사라져요.<br>
      제한시간 <b>100초</b> 동안 최대한 많이 없애서 점수를 모아보세요!
    </p>
    <button class="btn" id="startBtn">시작하기</button>
  </div>
</div>

<div class="overlay hidden" id="endOverlay">
  <div class="panel">
    <h1>게임 종료!</h1>
    <div id="recordBadge" class="record-badge" style="display:none;">🏆 신기록 달성! 🏆</div>
    <p>이번 판 최종 점수</p>
    <div class="final-score" id="finalScore">0</div>
    <button class="btn" id="restartBtn">다시하기</button>
  </div>
</div>

<script>
(function () {
  const COLS = 17, ROWS = 10, GAME_TIME = 100;

  const boardEl = document.getElementById('board');
  const selectionBoxEl = document.getElementById('selectionBox');
  const sumBadgeEl = document.getElementById('sumBadge');
  const timeValueEl = document.getElementById('timeValue');
  const timeStatEl = document.getElementById('timeStat');
  const scoreValueEl = document.getElementById('scoreValue');
  const scoreHostEl = document.getElementById('scoreHost');
  const bestValueEl = document.getElementById('bestValue');
  const bestStatEl = document.querySelector('.stat.best');
  const recordBadgeEl = document.getElementById('recordBadge');
  const startOverlay = document.getElementById('startOverlay');
  const endOverlay = document.getElementById('endOverlay');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const finalScoreEl = document.getElementById('finalScore');

  const HIGH_SCORE_KEY = 'appleGameHighScore';

  let cells = [];       // {row, col, value, removed, el}
  let score = 0;
  let highScore = Number(localStorage.getItem(HIGH_SCORE_KEY)) || 0;
  let recordBrokenThisGame = false;
  let timeLeft = GAME_TIME;
  let timerId = null;
  let running = false;

  bestValueEl.textContent = String(highScore);

  let dragging = false;
  let startPos = null;   // {x, y} relative to board
  let currentSelected = [];

  function buildGrid() {
    boardEl.innerHTML = '';
    cells = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const value = 1 + Math.floor(Math.random() * 9);
        const cellEl = document.createElement('div');
        cellEl.className = 'cell';
        cellEl.style.gridRowStart = r + 1;
        cellEl.style.gridColumnStart = c + 1;

        const appleEl = document.createElement('div');
        appleEl.className = 'apple';
        const stemEl = document.createElement('div');
        stemEl.className = 'stem';
        const numEl = document.createElement('div');
        numEl.className = 'num';
        numEl.textContent = value;

        appleEl.appendChild(numEl);
        cellEl.appendChild(stemEl);
        cellEl.appendChild(appleEl);
        boardEl.appendChild(cellEl);

        cells.push({ row: r, col: c, value, removed: false, el: cellEl });
      }
    }
  }

  function cellAt(row, col) {
    return cells[row * COLS + col];
  }

  function resetGame() {
    score = 0;
    timeLeft = GAME_TIME;
    recordBrokenThisGame = false;
    scoreValueEl.textContent = '0';
    timeValueEl.textContent = String(GAME_TIME);
    timeStatEl.classList.remove('low');
    recordBadgeEl.style.display = 'none';
    buildGrid();
  }

  function startGame() {
    resetGame();
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    running = true;
    clearInterval(timerId);
    timerId = setInterval(tick, 1000);
  }

  function tick() {
    timeLeft--;
    timeValueEl.textContent = String(timeLeft);
    if (timeLeft <= 10) timeStatEl.classList.add('low');
    if (timeLeft <= 0) {
      endGame();
    }
  }

  function endGame() {
    running = false;
    clearInterval(timerId);
    finalScoreEl.textContent = String(score);
    recordBadgeEl.style.display = recordBrokenThisGame ? 'inline-block' : 'none';
    endOverlay.classList.remove('hidden');
  }

  function addScore(n) {
    score += n;
    scoreValueEl.textContent = String(score);
    const pop = document.createElement('div');
    pop.className = 'score-pop';
    pop.textContent = '+' + n;
    scoreHostEl.appendChild(pop);
    setTimeout(() => pop.remove(), 800);

    if (score > highScore) {
      highScore = score;
      localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
      bestValueEl.textContent = String(highScore);
      bestStatEl.classList.add('flash');
      setTimeout(() => bestStatEl.classList.remove('flash'), 500);

      if (!recordBrokenThisGame) {
        recordBrokenThisGame = true;
        celebrateNewRecord();
      }
    }
  }

  function spawnFirework(x, y) {
    const colors = ['#ff5e5e', '#ffd23f', '#38e07a', '#4fa8ff', '#ff8ad8', '#c17aff'];
    const count = 26;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.2;
      const dist = 60 + Math.random() * 70;
      const p = document.createElement('div');
      p.className = 'firework-particle';
      p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      p.style.color = colors[Math.floor(Math.random() * colors.length)];
      p.style.background = p.style.color;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 900);
    }
  }

  function celebrateNewRecord() {
    const banner = document.createElement('div');
    banner.className = 'record-banner';
    banner.textContent = '🎉 새로운 최고 기록! 🎉';
    document.body.appendChild(banner);
    setTimeout(() => banner.remove(), 2200);

    const bursts = 5;
    for (let b = 0; b < bursts; b++) {
      setTimeout(() => {
        const x = window.innerWidth * (0.15 + Math.random() * 0.7);
        const y = window.innerHeight * (0.2 + Math.random() * 0.35);
        spawnFirework(x, y);
      }, b * 220);
    }
  }

  // ---- Drag selection logic ----

  function getBoardRect() {
    return boardEl.getBoundingClientRect();
  }

  function pointToRowCol(x, y, rect) {
    const cellW = rect.width / COLS;
    const cellH = rect.height / ROWS;
    let col = Math.floor((x - rect.left) / cellW);
    let row = Math.floor((y - rect.top) / cellH);
    col = Math.max(0, Math.min(COLS - 1, col));
    row = Math.max(0, Math.min(ROWS - 1, row));
    return { row, col };
  }

  function clearSelectionVisual() {
    currentSelected.forEach(cell => {
      cell.el.classList.remove('selected', 'hit');
    });
    currentSelected = [];
  }

  function updateSelection(clientX, clientY) {
    const rect = getBoardRect();
    const startRC = pointToRowCol(startPos.x, startPos.y, rect);
    const curRC = pointToRowCol(clientX, clientY, rect);

    const r0 = Math.min(startRC.row, curRC.row);
    const r1 = Math.max(startRC.row, curRC.row);
    const c0 = Math.min(startRC.col, curRC.col);
    const c1 = Math.max(startRC.col, curRC.col);

    // update visual selection box (screen coords relative to board-frame)
    const cellW = rect.width / COLS;
    const cellH = rect.height / ROWS;
    const boxLeft = c0 * cellW;
    const boxTop = r0 * cellH;
    const boxW = (c1 - c0 + 1) * cellW;
    const boxH = (r1 - r0 + 1) * cellH;

    selectionBoxEl.style.display = 'block';
    selectionBoxEl.style.left = boxLeft + 'px';
    selectionBoxEl.style.top = boxTop + 'px';
    selectionBoxEl.style.width = boxW + 'px';
    selectionBoxEl.style.height = boxH + 'px';

    clearSelectionVisual();
    let sum = 0;
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        const cell = cellAt(r, c);
        if (!cell.removed) {
          sum += cell.value;
          cell.el.classList.add('selected');
          currentSelected.push(cell);
        }
      }
    }

    const isHit = sum === 10 && currentSelected.length >= 2;
    selectionBoxEl.classList.toggle('hit', isHit);
    currentSelected.forEach(cell => cell.el.classList.toggle('hit', isHit));

    sumBadgeEl.style.display = currentSelected.length ? 'block' : 'none';
    sumBadgeEl.style.left = (boxLeft + boxW / 2) + 'px';
    sumBadgeEl.style.top = boxTop + 'px';
    sumBadgeEl.textContent = sum;
    sumBadgeEl.classList.toggle('hit', isHit);

    return { sum, isHit };
  }

  function finishSelection(result) {
    selectionBoxEl.style.display = 'none';
    sumBadgeEl.style.display = 'none';

    if (result && result.isHit) {
      const toRemove = currentSelected.slice();
      const removedCount = toRemove.length;
      toRemove.forEach(cell => {
        cell.el.classList.add('popping');
      });
      setTimeout(() => {
        toRemove.forEach(cell => {
          cell.removed = true;
          cell.el.classList.remove('selected', 'hit', 'popping');
          cell.el.classList.add('removed');
        });
      }, 350);
      addScore(removedCount);
      currentSelected = [];
    } else if (result && currentSelected.length) {
      currentSelected.forEach(cell => cell.el.classList.add('shake'));
      setTimeout(() => {
        currentSelected.forEach(cell => cell.el.classList.remove('shake'));
        clearSelectionVisual();
      }, 300);
    } else {
      clearSelectionVisual();
    }
  }

  boardEl.addEventListener('pointerdown', (e) => {
    if (!running) return;
    dragging = true;
    boardEl.setPointerCapture(e.pointerId);
    startPos = { x: e.clientX, y: e.clientY };
    updateSelection(e.clientX, e.clientY);
  });

  boardEl.addEventListener('pointermove', (e) => {
    if (!dragging || !running) return;
    updateSelection(e.clientX, e.clientY);
  });

  boardEl.addEventListener('pointerup', (e) => {
    if (!dragging) return;
    dragging = false;
    if (!running) { clearSelectionVisual(); selectionBoxEl.style.display='none'; sumBadgeEl.style.display='none'; return; }
    const result = updateSelection(e.clientX, e.clientY);
    finishSelection(result);
  });

  boardEl.addEventListener('pointercancel', () => {
    dragging = false;
    selectionBoxEl.style.display = 'none';
    sumBadgeEl.style.display = 'none';
    clearSelectionVisual();
  });

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);

  // build an initial static grid behind the start overlay
  buildGrid();
